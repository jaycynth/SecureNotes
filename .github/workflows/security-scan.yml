name: Android Security Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install mobsfscan
        run: pip install mobsfscan

      - name: Run mobsfscan
        # --exit: Exit with non-zero code if issues are found
        # --severity: Set threshold for failure (high/critical)
        # --json --html --sarif: Generate report formats for audit trail
        run: mobsfscan . --json --output mobsfscan-result.json --html --output mobsfscan-result.html --sarif --output mobsfscan-result.sarif --exit --severity high

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-security-reports
          path: |
            mobsfscan-result.json
            mobsfscan-result.html
            mobsfscan-result.sarif
